services:
  db:
    image: postgres:18
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/02-donnees-test.sql:/docker-entrypoint-initdb.d/02-donnees-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8001}
    volumes:
      - ./apps/client:/app
      - client_node_modules:/app/node_modules

volumes:
  postgres_data:
  client_node_modules: