services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-time_manager}
      POSTGRES_USER: ${POSTGRES_USER:-time_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-time_manager}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-time_manager}:${POSTGRES_PASSWORD:-time_manager}@db:5432/${POSTGRES_DB:-time_manager}
      SECRET_KEY: ${SECRET_KEY:-local-development-key}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8001}
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./apps/client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  client_node_modules: