
services:
  db:
    image: postgres:18

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Variable POSTGRES_DB manquante}
      POSTGRES_USER: ${POSTGRES_USER:?Variable POSTGRES_USER manquante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable POSTGRES_PASSWORD manquante}

    ports:
      - "127.0.0.1:${DATABASE_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

      - type: bind
        source: ./database/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: ../../apps/api
      dockerfile: ../../dockerfile/dev/Dockerfile

    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_PORT: ${APP_PORT:-8001}
      API_URL: http://localhost:${APP_PORT:-8001}
      SWAGGER_URL: http://localhost:8080
      SECRET_KEY: ${SECRET_KEY}

    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"

    volumes:
      - type: bind
        source: ../../apps/api
        target: /app
        bind:
          create_host_path: false

    depends_on:
      db:
        condition: service_healthy

    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
    - "8080:8080"
    environment:
      SWAGGER_JSON: http://api:8000/openapi.json
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data: